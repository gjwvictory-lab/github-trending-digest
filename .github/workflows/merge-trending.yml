name: merge-trending
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: merge digest branches into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/trending/*:refs/remotes/origin/trending/*'
          merged=0
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/trending); do
            if git merge-base --is-ancestor "$ref" HEAD; then
              echo "skip $ref (already merged)"
              continue
            fi
            echo "merge $ref"
            git merge --no-ff -X theirs "$ref" -m "merge $ref into main"
            merged=1
          done
          if [ "$merged" = "1" ]; then git push origin main; else echo "nothing to merge"; fi
